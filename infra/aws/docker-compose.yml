# Neuronita EVF — standalone AWS EC2 deployment (nginx + Certbot).
# App + its own Postgres + nginx reverse proxy + Certbot for auto-renewing TLS.
# Initial certificate issuance is bootstrapped by switch-to-nginx.sh.
name: neuronita-evf

services:
  evf-postgres:
    image: postgres:16-alpine
    container_name: neuronita-evf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - evf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - evfnet

  evf-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: neuronita-evf:latest
    container_name: neuronita-evf-api
    restart: unless-stopped
    depends_on:
      evf-postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_HOST: evf-postgres
      DATABASE_PORT: "5432"
      NODE_ENV: production
      PORT: "3000"
      STORAGE_PATH: /app/server/storage/reports
    volumes:
      - evf-storage:/app/server/storage
    networks:
      - evfnet

  nginx:
    image: nginx:alpine
    container_name: neuronita-evf-nginx
    restart: unless-stopped
    depends_on:
      - evf-api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    # Reload every 6h so renewed certificates are picked up without downtime.
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    networks:
      - evfnet

  certbot:
    image: certbot/certbot
    container_name: neuronita-evf-certbot
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    # Attempt renewal twice a day (no-op until a cert exists).
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

networks:
  evfnet:
    driver: bridge

volumes:
  evf-postgres-data:
  evf-storage:
  certbot-www:
  certbot-conf:
