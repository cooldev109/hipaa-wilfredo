# Neuronita EVF — standalone AWS EC2 deployment.
# Runs the app + its own Postgres + Caddy (automatic HTTPS) on one instance.
# Caddy obtains/renews a Let's Encrypt cert for DOMAIN automatically once the
# domain's DNS points at this server's public IP.
#
# Usage:
#   cp .env.example .env   # or let deploy-aws.sh generate it
#   docker compose up -d --build
name: neuronita-evf

services:
  evf-postgres:
    image: postgres:16-alpine
    container_name: neuronita-evf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - evf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - evfnet

  evf-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: neuronita-evf:latest
    container_name: neuronita-evf-api
    restart: unless-stopped
    depends_on:
      evf-postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_HOST: evf-postgres
      DATABASE_PORT: "5432"
      NODE_ENV: production
      PORT: "3000"
      STORAGE_PATH: /app/server/storage/reports
    volumes:
      - evf-storage:/app/server/storage
    networks:
      - evfnet

  caddy:
    image: caddy:2-alpine
    container_name: neuronita-evf-caddy
    restart: unless-stopped
    depends_on:
      - evf-api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - evfnet

networks:
  evfnet:
    driver: bridge

volumes:
  evf-postgres-data:
  evf-storage:
  caddy-data:
  caddy-config:
