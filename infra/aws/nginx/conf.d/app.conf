# Final HTTPS config (applied by switch-to-nginx.sh after the cert is issued).
# Port 80: serve the ACME challenge + redirect everything else to HTTPS.
server {
    listen 80;
    server_name neuronita.org www.neuronita.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: terminate TLS and reverse-proxy to the app container.
server {
    listen 443 ssl;
    http2 on;
    server_name neuronita.org www.neuronita.org;

    ssl_certificate     /etc/letsencrypt/live/neuronita.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neuronita.org/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://evf-api:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
